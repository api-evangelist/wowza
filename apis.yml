- aid: wowza:wowza-stream-targets-api
  name: Wowza stream_targets API
  description: "Operations related to stream targets. A stream target is a destination for a stream. Stream\
    \ targets can be Wowza Video edge resources; custom, external destinations, target destinations.\n\
    \ \n ### Wowza CDN Stream Targets\n Wowza CDN stream targets distribute streams to players. When you\
    \ create a live stream in the API, a Wowza CDN stream target is created automatically. \n \n \n In\
    \ contrast, you can use ``/stream_targets/wowza_cdn`` endpoints to manually create Wowza CDN stream\
    \ targets and associate them with transcoders.\n \n \n With Wowza CDN stream targets, you can use\
    \ geo-blocking to control locations where your stream can be viewed, and you can use token authentication\
    \ to restrict access to streams. Advanced configuration properties are available for Wowza CDN stream\
    \ targets.\n \n ### Custom Stream Targets\n Custom stream targets connect to external CDNs to deliver\
    \ streams to viewers. You manually create custom stream targets and associate them to a transcoder."
  humanURL: https://developer.wowza.com/docs/wowza-video/api/video/openapi
