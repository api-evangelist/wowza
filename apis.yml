- aid: wowza:wowza-advanced-token-authentication-api
  name: Wowza advanced_token_authentication API
  description: "Operations related to using advanced token authentication, known in Wowza Video as a default\
    \ playback token behavior option, with videos. \n\nUse token authentication when distributing valuable\
    \ or sensitive video content to audiences to ensure that only authorized users can access the content\
    \ within the intended application. This allows for protection of intellectual property, compliance\
    \ with regulations, and the ability to maintain control over content distribution.  The token is embedded\
    \ in the videos' embed URLs. \n\nThrough the <a href=\"https://www.wowza.com/docs/video-details-page-in-wowza-video\"\
    \ target=\"_blank\">UI</a> or <a href=\"https://developer.wowza.com/docs/wowza-video/api/video/current/tag/videos/#tag/videos/operation/patchVideo\"\
    \ target=\"_blank\">Wowza Video API</a>, you can choose one of the following options for token authentication\
    \ of a video:\n \n - **NO_TOKEN** - Video files are accessible and can be downloaded and played by\
    \ anyone at any time. This is the default.  \n - **BASIC_TOKEN** - The platform automatically creates\
    \ tokenized video URLs. This setting makes it hard for a viewer to extract the video URL and store\
    \ it for usage in unintended applications over time since the embed URL, which has the token as part\
    \ of the URL, will only be playable for 48 hours. The token auto renews after 48 hours when used in\
    \ the intended application. \n - **ADVANCED_TOKEN** - You add the stream's JS embed code (Share Stream)\
    \ and a token to your site to provide tokenization.  The protections are similar to those for the\
    \ Basic Token option except you customize the time limit, geographical limits, etc. during token creation.\
    \ \n - **FOLLOW_DEFAULT:** - The token behavior is based on the **Default Playback Token Behavior**\
    \ setting you selected for your Wowza account. See the <a href=\"https://www.wowza.com/docs/org-setting-page-in-wowza-video\"\
    \ target=\"_blank\">Org Settings page in Wowza Video</a> article for where to set this configuration.\
    \ \n\n    **Note:** You'll use the <a href=\"https://developer.wowza.com/docs/wowza-video/api/video/current/tag/videos/#tag/videos/operation/patchVideo\"\
    \ target=\"_blank\">/videos endpoints</a> to update and review the token authentication enums bulleted\
    \ above.\n\nBefore selecting to use the **ADVANCED_TOKEN**, you must, first, either: \n\n - Generate\
    \ a key id via the Wowza Video API, then customize and generate a token via the Wowza Video 2.0 API\
    \ to add to your site. You'll need the key id to create and sign the token.  \n - Generate a key id\
    \ and key via the Wowza Video 2.0 API, then customize and generate a standard common access token\
    \ (CAT) through the means you usually use to create tokens to add to your site. You'll need the key\
    \ id and key to create and sign the token.  \n\n\n After you have your playback token, you add the\
    \ video JS-embed and the playback token to your site if you're going to use the **ADVANCED_TOKEN**\
    \ option. The JS-embed code automatically adds the player and related video to your site. See the\
    \ section on <a href=\"<a href=\"https://developer.wowza.com/docs/wowza-video/api/video/current/tag/videos/#tag/videos/operation/patchVideo\"\
    \ target=\"_blank\">how to embed the player and video</a>\"."
