- aid: wowza:wowza-vod-streams-api
  name: Wowza vod_streams API
  description: "<blockquote>The <strong>VOD stream</strong> operations are deprecated in 2.0. Use the\
    \ <strong>/videos</strong> endpoints instead.</blockquote> \n\nOperations related to video on demand\
    \ (VOD) streams, which are created through the ``/live_streams`` or ``/transcoders`` resources. A\
    \ VOD stream is a recording of a live stream that viewers can replay at a later date. After the broadcast\
    \ is over and the live stream or transcoder is stopped, Wowza Video creates the VOD stream and generates\
    \ a playback URL. See [About VOD Streams](https://www.wowza.com/docs/create-a-vod-stream#about-vod-streams)\
    \ to learn more."
  humanURL: https://developer.wowza.com/docs/wowza-video/api/video/openapi
