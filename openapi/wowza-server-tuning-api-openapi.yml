        '401':
          description: Unauthorized
        '404':
          description: Not found
        '500':
          description: Internal server error
    put:
      tags:
      - Server Tuning
      operationId: putServerTuneConfig
      summary: Update tuning config
      description: Updates the server tuning configuration. This API is available in builds 15089 or later.
