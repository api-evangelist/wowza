          description: ''
          required:
          - name
          - transcoder_type
          - billing_mode
          - broadcast_location
          - protocol
          - delivery_method
          properties:
            billing_mode:
              type: string
              description: 'The billing mode for the transcoder. The default is **pay_as_you_go**.


                **pay_as_you_go** — Billed as a single event. A single event is use-based and you incur charges for the time spent streaming.


                **twentyfour_seven** — Billed as a 24x7 channel. A 24x7 channel is unlimited stream time for one channel. This billing mode doesn''t incur overages, since it''s unlimited.'
              example: ''
              enum:
              - pay_as_you_go
              - twentyfour_seven
            broadcast_location:
              type: string
              description: The location where Wowza Video transcodes your stream. Choose a location as close as possible to your video source.
              example: ''
              enum:
              - asia_pacific_australia
              - asia_pacific_india
              - asia_pacific_japan
              - asia_pacific_singapore
              - asia_pacific_s_korea
              - asia_pacific_taiwan
              - eu_belgium
              - eu_germany
              - eu_ireland
              - south_america_brazil
              - us_central_iowa
              - us_east_s_carolina
              - us_east_virginia
              - us_west_california
              - us_west_oregon
            delivery_method:
              type: string
              description: The type of connection between the source encoder and the transcoder. The default, **pull**, instructs the transcoder to pull the video from the source. **push** instructs the source to push the stream to the transcoder. **cdn** uses a stream source to deliver the stream to the transcoder.
              example: ''
              enum:
              - pull
              - cdn
              - push
            name:
              type: string
              description: A descriptive name for the transcoder. Maximum 200 characters.
              example: ''
            protocol:
              type: string
              description: The transport protocol for the source video. The default is **rtmp**.
              example: ''
              enum:
              - file
              - rtmp
              - rtsp
              - srt
              - udp
              - webrtc
            transcoder_type:
              type: string
              description: 'The type of transcoder, either **transcoded** for streams that are transcoded into adaptive bitrate renditions or **passthrough** for streams that aren''t processed by the transcoder.




                > **Note**: **passthrough** isn''t supported in the **asia_pacific_singapore** region.




                Default: **transcoded**'
              example: ''
              enum:
              - transcoded
              - passthrough
            buffer_size:
              type: integer
              description: 'The size, in milliseconds, of the incoming buffer. **0** means no buffer. The default is **4000** (4 seconds).


                **Example:** <code>"buffer_size": 4000</code>'
              example: ''
              enum:
              - 0
