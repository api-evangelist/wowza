        playback_urls:
          type: object
          description: Web addresses that the target uses to play streams.
          properties:
            hls:
              type: array
              description: Web address that the target uses to play HLS streams.
              items:
                type: object
                title: hls
                properties:
                  name:
                    type: string
                    description: The name of the playback URL.
                    example: default
                  url:
                    type: string
                    description: The playback URL.
                    example: ''
        state:
          type: string
          description: The state of the stream target.
          example: ''
          enum:
          - activated
          - archived
        stream_name:
          type: string
          description: The name of the stream being ingested into the target.
          example: ''
        referer_enabled:
          type: boolean
          description: 'If **true**, controls access to the stream from specific domains. The client or player requesting access to the stream must send the Referer header so the origin of the request can be validated. The default is **false**.


            **Note:** If you change *referer_enabled* to **false** after configuring the referer policy, then later re-enable it, you''ll need to re-configure the other referer policy values as well.

            Available from version 1.7. For more information about the Referer header, see the [HTTP specification](https://tools.ietf.org/html/rfc7231#section-5.5.2).'
          example: ''
        referer_allow_empty:
          type: boolean
          description: 'The Referer header sent by the client or player can be empty and not identify the origin of the request. The default is **false** when *referer_enabled* is **true**. While less secure, if you know you''ll have viewers with a client or player that won''t send a Referer header, you can specify **true** to allow an empty Referer header so those viewers can still access the stream.


            Available from version 1.7.'
          example: ''
        referer_policy:
          type: string
          description: 'Specifies whether to **allow** or **deny** access to the stream from specific domains. The default is **allow** when *referer_enabled* is **true**. Specify the domains to allow or deny in *referer_domains*.


            Available from version 1.7.'
          example: ''
          enum:
          - allow
          - deny
        referer_domains:
          type: string
          description: 'Domains that are either allowed or blocked from accessing the stream. Enter a comma-separated list of domains that are always allowed or denied access based on the *referer_policy* value. Required when *referer_enabled* is **true**.


            We recommend you enter the simplest form of the domain as possible, but you do need to build out the domain to the level of subdomains you want to allow or deny. You can fully express to the subdomain (_mysubdomain.example.com_) to specify that single, specific subdomain or you can use a wildcard (&#42;) to cover all subdomains at a specific level (_&#42;.example.com_).


            **Example:** _example.com, *.example.com, *.mysubdomain.example.com_


            If you entered the above example value for *referer_domains*, and *referer_policy* is **allow**, the following domains are allowed access to the stream: <ul> <li>https://example.com</li> <li>https://subdomain.example.com, https://subdomain2.example.com, etc.</li> <li>https://subdomainA.mysubdomain.example.com, https://subdomainB.mysubdomain.example.com, etc.</li> </ul>


            Available from version 1.7.'
          example: ''
        token_auth_enabled:
          type: boolean
          description: If **true**, token authentication protects the stream by ensuring that it's delivered only to authorized viewers and can't be shared by unauthorized links or player hijacking attacks. The default is **false**.
          example: ''
        token_auth_shared_secret:
          type: string
          description: The shared secret of the token authentication. Must contain only hexadecimal characters and be an even number of total characters not exceeding 32.
          example: ''
        token_auth_playlist_only:
          type: boolean
          description: 'If **true**, Wowza Video uses token authentication to protect the master playlist only and leaves individual media playlists and media segments unprotected.  This feature enables playback compatibility with media players that don’t support the *withCredentials* property. It may also be useful when addressing  token auth compatibility issues with specific browsers. The default is **false**.


            **Note**: If you''ve enabled MPEG-DASH on your stream target, `token_auth_playlist_only` applies to both the `playlist.m3u8` for HLS and `manifest.mpd` for MPEG-DASH.'
          example: ''
        updated_at:
          type: string
          description: The date and time that the stream target was updated.
          example: ''
          format: date-time
      example:
        id: abc45lfyz
        name: My Wowza CDN Stream Target
        state: activated
        stream_name: 9a00105a
        delivery_protocols:
        - hls
        playback_urls:
          hls:
          - name: default
            url: https://wowzasubdomain.wowza.com/1/TWhoL3BiZnJXMFhmNzZVN3JrZDAwUT09/ZmYxSXRrTERrUlk9/hls/live/playlist.m3u8
        token_auth_enabled: false
        token_auth_playlist_only: false
        geoblock_enabled: true
        geoblock_by_location: allow
        geoblock_country_codes: DE, US
        geoblock_ip_override: deny
        geoblock_ip_addresses: 77.12.34.567, 78.23.45.678
        referer_enabled: true
        referer_allow_empty: false
        referer_policy: allow
        referer_domains: example.com, example2.com
        force_ssl_playback: false
        created_at: '2020-01-28T17:16:22.086Z'
        updated_at: '2020-01-30T15:33:43.086Z'
    custom_stream_target_create_input:
      description: ''
      allOf:
      - $ref: '#/components/schemas/custom_stream_target_input'
      example:
        stream_target_custom:
          name: My Custom Stream Target
          primary_url: rtmp://p.ep123456.i.akamaientrypoint.net/EntryPoint
          provider: rtmp
          stream_name: c8467d50@123456
    custom_stream_target_update_input:
      type: object
      description: ''
      required:
      - stream_target_custom
      properties:
        stream_target_custom:
          type: object
          title: stream_target_custom
          description: ''
          properties:
            backup_url:
              type: string
              description: 'The backup RTMP ingest URL of the custom stream target. Not all providers or third-party CDNs provide backup URLs. Not for use with the akamai_cupertino custom *provider*.


                **Note:** When both the primary and backup URLs are used, Wowza Video sends the stream to both URLs, allowing a provider or 3rd party CDN to improve reliability and prevent playback disruption. If you want to use both URLs, make sure you add the stream target to the output rendition twice, once with *use_stream_target_backup_url* as **false** (the default) and once with *use_stream_target_backup_url* as **true**. See <a href="https://api.docs.video.wowza.com/index/current/tag/transcoders/#tag/transcoders/operation/createTranscoderOutputOutputStreamTarget">POST /transcoders/[ID]/outputs/[ID]/output_stream_targets</a> for more information.


                **Example:** <code>"backup_url": "rtmp://b.ep337857.i.akamaientrypoint.net/EntryPoint"</code>'
              example: rtmp://b.ep337857.i.akamaientrypoint.net/EntryPoint
            name:
              type: string
              description: 'A descriptive name for the custom stream target. Maximum 255 characters.


                **Example:** <code>"name": "My Updated Custom Stream Target"</code>'
              example: My Updated Custom Stream Target
            password:
              type: string
              description: 'A *username* must be present. The password associated with the target username for RTMP authentication. Not for use with the akamai_cupertino custom *provider*.


                **Note:** If you want to clear both username and password for RTMP authentication, send an empty string for both username and password fields.


                **Example:** <code>"password": "cb1e77e98d"</code>'
              example: cb1e77e98d
            playback_urls:
              type: object
              title: Hash of playback URLs
              description: 'Web addresses that the target uses to play streams. Available from version 1.7.



                **Example:** See response body sample'
              properties:
                hls:
                  type: string
                  description: Web address that the target uses to play HLS streams. <br/><br/> The format is a hash where the key is **hls** and the value is the playback URL. <br/>Example&#58; "hls":&nbsp;"http&#58;//&lt;*domain*&gt;/master.m3u8"
                hds:
                  type: string
                  description: Web address that the target uses to play HDS streams. Not for use with the akamai_cupertino custom *provider*. <br/><br/>The format is a hash where the key is **hds** and the value is the playback URL. <br/>Example&#58; "hds":&nbsp;"http&#58;//&lt;*domain*&gt;/manifest.f4m"
                rtmp:
                  type: string
                  description: Web address that the target uses to play RTMP streams. <br/><br/>The format is a hash where the key is **rtmp** and the value is the playback URL. <br/>Example&#58; "rtmp":&nbsp;"rtmp&#58;//cp319499.live.edgefcs.net/live/c9467d50@337857"
            primary_url:
              type: string
              description: 'The primary RTMP ingest URL. Hostnames can''t contain underscores.


                **Example:** <code>"primary_url": "rtmp://b.ep337857.i.akamaientrypoint.net/EntryPoint"</code>'
              example: rtmp://p.ep337857.i.akamaientrypoint.net/EntryPoint
            provider:
              type: string
              description: 'The CDN for the target.


                **Example:** <code>"provider": "akamai_cupertino"</code>'
              example: rtmp
              enum:
              - akamai_cupertino
              - rtmp
              - rtmps
            stream_name:
              type: string
              description: 'The name of the stream as defined in the target''s ingestion settings. The protocol, host name, and path components of the stream name URL must be 255 characters or less. The query strings and parameter components of the stream name URL must be 1024 characters or less.


                **Example:** <code>"stream_name": "c8467d50@337857"</code>'
              example: c8467d50@337857
            username:
              type: string
              description: 'The username or ID that the target uses for RTMP authentication. Not for use with the akamai_cupertino custom *provider*.


                **Note:** If you want to clear both username and password for RTMP authentication, send an empty string for both username and password fields.


                **Example:** <code>"username": "319699"</code>'
              example: '319699'
          example:
            name: My Updated Custom Stream Target
    stream_target_property_fastly:
      type: object
      title: property
      description: ''
      required:
      - key
      - section
      - value
      properties:
        key:
          type: string
          description: 'The key of the property.


            The following table lists the available property keys.


            Key | Description

            ----------------|-------------

            **acao** | Explicitly specifies the origin that can access the stream. While most streams won''t need the origin explicitly set, you might use this property for older players that don''t send the Referer header in their stream request.

            **chunkSize** | Defines the duration of the time-based audio and video chunks that Wowza Video delivers to the target.

            **convertAMFData** | Determines whether Wowza Video converts incoming AMF data into ID3 tags.

            **playlistSeconds** | Defines the maximum allowable length of the playlist.

            **relativePlaylists** | Allows the viewer to watch the stream over HTTP and HTTPS, whichever protocol their browser calls.'
          example: ''
          enum:
          - acao
          - chunkSize
          - convertAMFData
          - playlistSeconds
          - relativePlaylists
        section:
          type: string
          description: 'The section of the stream target configuration table that contains the

            property.



            Section | Valid keys for the section

            ----------------|-------------

            **hls** | **acao**, **chunkSize**, and **convertAMFData**

            **playlist** | **playlistSeconds** and **relativePlaylists**'
          example: ''
          enum:
          - hls
          - playlist
        value:
          type: string
          description: '

            The value of the property.


            The following table provides information about valid values for each property key.


            Key(s) | Values for the key

            ----------------|-------------

            **acao** | Displays as **http://&lt;_origin_&gt;**

            **chunkSize** | Valid values are the integers **2**, **4**, **6**, **8**, and **10**.

            **convertAMFData** <br/> **relativePlaylists** | Valid values are the Booleans **true** and **false**.

            **playlistSeconds** | Valid values are any integer between **6** and **28800** (8 hours).'
          example: ''
      example:
        key: chunkSize
        section: hls
        value: 6
