openapi: 3.2.0
info:
  title: Wowza Streaming Engine REST Machine Stats API
  description: Complete REST API for Wowza Streaming Engine. Auto-converted from Swagger 1.2 (http://localhost:8089/swagger.json) to OpenAPI 3.0.3 for public documentation.
  version: 2.0.0
  contact:
    name: Wowza Media Systems
    url: https://www.wowza.com/docs/wowza-streaming-engine-rest-api
  license:
    name: Wowza Media Systems
    url: https://www.wowza.com
servers:
- url: http://localhost:8087
  description: Wowza Streaming Engine Server
security:
- basicAuth: []
tags:
- name: Machine Stats
  description: ''
paths:
  /v2/machine/monitoring/current:
    get:
      tags:
      - Machine Stats
      operationId: getCurrentMachineStatistics
      summary: Get current stats
      description: Retrieves current statistics for the machine. This API is available in builds 15089 or later.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentMachineStatistics'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '500':
          description: Internal server error
  /v2/machine/monitoring/historic:
    get:
      tags:
      - Machine Stats
      operationId: getHistoricMachineStatistics
      summary: Get historic stats
      description: Retrieves historic statistics for the machine. This API is available in builds 15089 or later.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricMachineStatistics'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '500':
          description: Internal server error
components:
  schemas:
    CurrentMachineStatistics:
      type: object
      properties:
        heapUsed:
          $ref: '#/components/schemas/Long'
        cpuSystem:
          $ref: '#/components/schemas/Integer'
        connectionCount:
          $ref: '#/components/schemas/Long'
        memoryFree:
          $ref: '#/components/schemas/Long'
        cpuIdle:
          $ref: '#/components/schemas/Integer'
        serverName:
          type: string
        memoryUsed:
          $ref: '#/components/schemas/Long'
        version:
          type: string
        diskFree:
          $ref: '#/components/schemas/Long'
        cpuUser:
          $ref: '#/components/schemas/Integer'
        diskUsed:
          $ref: '#/components/schemas/Long'
        heapFree:
          $ref: '#/components/schemas/Long'
        serverUptime:
          type: integer
          format: int64
        saveFieldList:
          type: array
          items:
            type: string
      required:
      - version
      - serverName
      - serverUptime
      - cpuIdle
      - cpuUser
      - cpuSystem
      - memoryFree
      - memoryUsed
      - heapFree
      - heapUsed
      - diskFree
      - diskUsed
      - connectionCount
    Long:
      type: object
      properties: {}
    Integer:
      type: object
      properties: {}
    HistoricMachineStatistics:
      type: object
      properties:
        serverName:
          type: string
        saveFieldList:
          type: array
          items:
            type: string
        version:
          type: string
      required:
      - version
      - serverName
      - entries
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication using Wowza Streaming Engine admin credentials
    digestAuth:
      type: http
      scheme: digest
      description: HTTP Digest Authentication
