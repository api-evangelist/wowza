        id:
          type: string
        saveFieldList:
          type: array
          items:
            type: string
        version:
          type: string
        url:
          type: string
      required:
      - version
      - serverName
      - id
      - url
      - headers
      - auth
    Integer:
      type: object
      properties: {}
    Boolean:
      type: object
      properties: {}
    Long:
      type: object
      properties: {}
    TargetConfig:
      type: object
      properties:
        headers:
          type: array
          items:
            $ref: '#/components/schemas/TargetHeader'
        auth:
          $ref: '#/components/schemas/TargetAuth'
        id:
          type: string
        url:
          type: string
      required:
      - id
      - url
      - headers
      - auth
    SourceItem:
      type: object
      properties:
        serverName:
          type: string
        source:
          type: string
        saveFieldList:
          type: array
          items:
            type: string
        version:
          type: string
      required:
      - version
      - serverName
      - source
    FilterConfig:
      type: object
      properties:
        retryDelay:
          $ref: '#/components/schemas/Long'
        retryDelayUnit:
          type: string
        targetRef:
          type: string
        criteria:
          type: string
        id:
          type: string
        enabled:
          $ref: '#/components/schemas/Boolean'
        maxRetryAttempts:
          $ref: '#/components/schemas/Integer'
      required:
      - id
      - enabled
      - criteria
      - targetRef
      - maxRetryAttempts
      - retryDelay
      - retryDelayUnit
    TargetHeader:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
      required:
      - name
      - value
    Webhooks:
      type: object
      properties:
        debugLog:
          $ref: '#/components/schemas/Boolean'
        source:
          type: string
        filters:
          type: array
          items:
            $ref: '#/components/schemas/FilterConfig'
        targets:
          type: array
          items:
            $ref: '#/components/schemas/TargetConfig'
      required:
      - debugLog
      - source
      - filters
      - targets
    FilterItem:
      type: object
      properties:
        retryDelay:
          $ref: '#/components/schemas/Long'
        retryDelayUnit:
          type: string
        targetRef:
          type: string
        criteria:
          type: string
        serverName:
          type: string
        id:
          type: string
        saveFieldList:
          type: array
          items:
            type: string
        version:
          type: string
        enabled:
          $ref: '#/components/schemas/Boolean'
        maxRetryAttempts:
          $ref: '#/components/schemas/Integer'
      required:
      - version
      - serverName
      - id
      - enabled
      - criteria
      - targetRef
      - maxRetryAttempts
      - retryDelay
      - retryDelayUnit
    WebhooksConfig:
      type: object
