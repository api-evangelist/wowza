components:
  schemas:
    TargetsList:
      type: object
      properties:
        serverName:
          type: string
        saveFieldList:
          type: array
          items:
            type: string
        version:
          type: string
        targets:
          type: array
          items:
            $ref: '#/components/schemas/TargetConfig'
      required:
      - version
      - serverName
      - targets
    FiltersList:
      type: object
      properties:
        serverName:
          type: string
