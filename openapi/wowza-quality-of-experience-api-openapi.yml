              title: Array of error density trends
              description: 'An array of error density trend data. The granularity of sampled data changes based on the from and to query values you use:


                <ul><li>0 minutes to 8 hours - Samples returned per minute</li> <li>8 hours, 1 second to 24 hours - Samples returned per hour</li> <li>24 hours, 1 second to 175 days - Samples returned per day</li> <li>175 days to 14 years - Samples returned per month</li> <li>14 years or greater - Samples returned per year</li></ul>'
              properties:
